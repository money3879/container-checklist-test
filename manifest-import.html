    if (!sheetDataEl) throw new Error('准單（紅紙）找不到 sheetData');

    const mergeCellsEl = red.xml.documentElement.getElementsByTagNameNS(NS,'mergeCells')[0];
    const originalMerges = mergeCellsEl
      ? Array.from(mergeCellsEl.getElementsByTagNameNS(NS,'mergeCell')).map(x => x.getAttribute('ref'))
      : [];
    const dataMerges = originalMerges.filter(ref => {
      const nums = (String(ref).match(/\d+/g) || []).map(Number);
      return nums.length && Math.min(...nums) === 22 && Math.max(...nums) === 22;
    });

    for (let i = 0; i < redExtra; i++) {
      const newRow = 23 + i;
      const clone = sourceRow.cloneNode(true);
      clone.setAttribute('r', String(newRow));

      for (const cell of Array.from(clone.getElementsByTagNameNS(NS,'c'))) {
        const oldRef = cell.getAttribute('r');
        if (!oldRef) continue;
        const ref = splitRef(oldRef);
        cell.setAttribute('r', `${ref.col}${newRow}`);

        const f = cell.getElementsByTagNameNS(NS,'f')[0];
        if (f) {
          // Template 第22列公式引用艙單第16列；第23列起依序引用17、18……。
          const manifestRow = 16 + (newRow - redStart);
          f.textContent = f.textContent.replace(
            /進口艙單印1份!([A-Z]{1,3})16\b/g,
            (_, col) => `進口艙單印1份!${col}${manifestRow}`
          );
          // 讓 Excel 重新計算；避免保留舊的公式快取。
          for (const v of Array.from(cell.getElementsByTagNameNS(NS,'v'))) cell.removeChild(v);
          const v = red.xml.createElementNS(NS,'v');
          v.textContent = '';
          cell.appendChild(v);
        }
      }
      sheetDataEl.insertBefore(clone, redFooterAfter);

      if (mergeCellsEl) {
        for (const ref of dataMerges) {
          const shifted = ref.replace(/(\d+)/g, m => String(Number(m) + i + 1));
          const exists = Array.from(mergeCellsEl.getElementsByTagNameNS(NS,'mergeCell'))
            .some(mc => mc.getAttribute('ref') === shifted);
          if (!exists) {
            const mc = red.xml.createElementNS(NS,'mergeCell');
            mc.setAttribute('ref', shifted);
            mergeCellsEl.appendChild(mc);
          }
        }
      }
    }
    if (mergeCellsEl) mergeCellsEl.setAttribute('count', String(mergeCellsEl.getElementsByTagNameNS(NS,'mergeCell').length));
  }

  // 紅紙 C6：Template 原本是範例船名（例如「大佑輪」），
  // 本次作業應改成目前卸存地所輸入的二程船名稱。
  const redShip2Name = (manifestByLocation[loc] && manifestByLocation[loc].ship2Name) || '';
  red.api.setValue('C6', redShip2Name);

  // 紅紙 C10:D13：Template 為合併儲存格，實際資料寫入左上角 C10。
  // 本次作業應帶入目前網站上選擇／輸入的卸存地。
  red.api.setValue('C10', loc);

  // 紅紙 G19:I19（Template 的實際合併範圍；使用左上角 G19）：
  // 依網站目前選擇／輸入的卸存地，更新「10.其他」的轉運說明。
  // T6（003C2002、003C2031）不加括號，直接帶入卸存地。
  const redOtherText = (() => {
    const normalizedLoc = normalizeLocationCode(loc);
    const transferPortMap = {
      'KHH0638S': '轉運至高雄港',
      'KHH0641S': '轉運至高雄港',
      'TPEE011S': '轉運至台北港',
      'TPEE021S': '轉運至台北港',
      'TPEN051S': '轉運至台北港',
      'TXG018DH': '轉運至台中港'
    };

    if (['003C2002', '003C2031'].includes(normalizedLoc)) {
      return `10.其他:過境台北港辦理儀檢後運往${normalizedLoc}`;
    }

    const transferPort = transferPortMap[normalizedLoc];
    if (transferPort) {
      return `10.其他:${transferPort}(${normalizedLoc} )`;
    }

    // 未列入對照表的卸存地先維持 Template 原本內容，避免影響既有功能。
    return '';
  })();
  if (redOtherText) red.api.setValue('G19', redOtherText);

  // 逐筆確認准單（紅紙）22列起的公式，完全按照 Template 原本公式模式，
  // 只將艙單來源列號由16、17、18依筆數延伸。
  for (let i = 0; i < items.length; i++) {
    const r = redStart + i;
    const mrow = 16 + i;
    red.api.setFormula(`A${r}`, `=進口艙單印1份!B${mrow}`, '');
    red.api.setFormula(`C${r}`, `=進口艙單印1份!T${mrow}`, '');
    red.api.setFormula(`F${r}`, `=進口艙單印1份!C${mrow}&進口艙單印1份!D${mrow}`, '');
    red.api.setFormula(`H${r}`, `=進口艙單印1份!I${mrow}`, '');
    red.api.setFormula(`I${r}`, `=進口艙單印1份!E${mrow}`, '');
  }

  const redDimension = red.xml.documentElement.getElementsByTagNameNS(NS,'dimension')[0];
  if (redDimension && redDimension.getAttribute('ref')) {
    const old = redDimension.getAttribute('ref');
    redDimension.setAttribute('ref', old.replace(/(\d+)$/, m => String(Number(m) + redExtra)));
  }

  // 紅紙列印範圍也跟著新增資料列往下延伸。
  // Template 1 筆時為 A1:I29；每增加 1 筆，固定區往下 1 列。
  // 因此 5 筆時為 A1:I33。
  const redPrintEnd = 29 + Math.max(0, items.length - 1);
  for (const dn of Array.from(workbookXml.getElementsByTagNameNS(NS,'definedName'))) {
    const name = dn.getAttribute('name');
    const localSheetId = dn.getAttribute('localSheetId');
    const text = String(dn.textContent || '');
    if (name === '_xlnm.Print_Area' && text.includes('准單(紅紙)-2份')) {
      dn.textContent = `'准單(紅紙)-2份'!$A$1:$I$${redPrintEnd}`;
    }
  }

  // ═══════════════════════════════════════════════════════════════════
  // 第三階段：只處理「准單申請-1份 」
  // 依艙單筆數增加資料列；資料列只有第22列 1 筆，
  // 第23列起為固定內容。新增列完全沿用第22列的格式、公式與合併結構。
  // 公式以最新 Template 為準，並只將來源的紅紙列號由22往後延伸。
  // ═══════════════════════════════════════════════════════════════════
  const application = await loadSheetXmlByName('准單申請-1份 ');
  const appStart = 22;
  const appTemplateCount = 1;
  const appExtra = Math.max(0, items.length - appTemplateCount);
  const appFooterStart = 23;

  if (!application.api.getRow(appFooterStart)) {
    throw new Error('准單申請範本找不到第 23 列固定內容');
  }

  if (appExtra > 0) {
    shiftRowsAndMerges(application.xml, appFooterStart, appExtra);
    const appFooterAfter = application.api.getRow(appFooterStart + appExtra);
    if (!appFooterAfter) throw new Error('准單申請固定內容移動失敗');

    const sourceRow = application.api.getRow(22);
    if (!sourceRow) throw new Error('准單申請範本找不到第 22 列資料樣板');
    const sheetDataEl = application.xml.documentElement.getElementsByTagNameNS(NS,'sheetData')[0];
    if (!sheetDataEl) throw new Error('准單申請找不到 sheetData');

    const mergeCellsEl = application.xml.documentElement.getElementsByTagNameNS(NS,'mergeCells')[0];
    const originalMerges = mergeCellsEl
      ? Array.from(mergeCellsEl.getElementsByTagNameNS(NS,'mergeCell')).map(x => x.getAttribute('ref'))
      : [];
    const dataMerges = originalMerges.filter(ref => {
      const nums = (String(ref).match(/\d+/g) || []).map(Number);
      return nums.length && Math.min(...nums) === 22 && Math.max(...nums) === 22;
    });

    for (let i = 0; i < appExtra; i++) {
      const newRow = 23 + i;
      const clone = sourceRow.cloneNode(true);
      clone.setAttribute('r', String(newRow));

      for (const cell of Array.from(clone.getElementsByTagNameNS(NS,'c'))) {
        const oldRef = cell.getAttribute('r');
        if (!oldRef) continue;
        const ref = splitRef(oldRef);
        cell.setAttribute('r', `${ref.col}${newRow}`);

        const f = cell.getElementsByTagNameNS(NS,'f')[0];
        if (f) {
          // Template 第24列引用紅紙第24列；新增列依序引用紅紙第25、26……列。
          const redRow = 22 + (newRow - appStart);
          f.textContent = f.textContent.replace(
            /'准單\(紅紙\)-2份'!([A-Z]{1,3})22\b/g,
            (_, col) => `'准單(紅紙)-2份'!${col}${redRow}`
          );
          // 清除舊的公式快取，讓 Excel 重新計算。
          for (const v of Array.from(cell.getElementsByTagNameNS(NS,'v'))) cell.removeChild(v);
          const v = application.xml.createElementNS(NS,'v');
          v.textContent = '';
          cell.appendChild(v);
        }
      }
      sheetDataEl.insertBefore(clone, appFooterAfter);

      if (mergeCellsEl) {
        for (const ref of dataMerges) {
          const shifted = ref.replace(/(\d+)/g, m => String(Number(m) + i + 1));
          const exists = Array.from(mergeCellsEl.getElementsByTagNameNS(NS,'mergeCell'))
            .some(mc => mc.getAttribute('ref') === shifted);
          if (!exists) {
            const mc = application.xml.createElementNS(NS,'mergeCell');
            mc.setAttribute('ref', shifted);
            mergeCellsEl.appendChild(mc);
          }
        }
      }
    }
    if (mergeCellsEl) mergeCellsEl.setAttribute('count', String(mergeCellsEl.getElementsByTagNameNS(NS,'mergeCell').length));
  }

  // 每一筆都直接沿用最新 Template 的公式模式，只改來源紅紙列號。
  for (let i = 0; i < items.length; i++) {
    const r = appStart + i;
    const redRow = 22 + i;
    application.api.setFormula(`A${r}`, `='准單(紅紙)-2份'!A${redRow}:B${redRow}`, '');
    application.api.setFormula(`C${r}`, `='准單(紅紙)-2份'!C${redRow}:E${redRow}`, '');
    application.api.setFormula(`F${r}`, `='准單(紅紙)-2份'!F${redRow}:H${redRow}`, '');
    application.api.setFormula(`H${r}`, `='准單(紅紙)-2份'!H${redRow}`, '');
    application.api.setFormula(`I${r}`, `='准單(紅紙)-2份'!I${redRow}:J${redRow}`, '');
  }


  // ═══════════════════════════════════════════════════════════════════
  // 第四階段：只處理「貨櫃清單-1份」
  // Template 原本 3 筆，每筆佔 2 列：
  // 第1筆 9~10、第2筆 11~12、第3筆 13~14。
  // 第15列起為固定內容。超過3筆時，每增加1筆就增加2列，
  // 並完整沿用 Template 第13~14列的格式、合併儲存格與公式。
  // ═══════════════════════════════════════════════════════════════════
  const cargo = await loadSheetXmlByName('貨櫃清單-1份');
  const cargoStart = 9;
  const cargoTemplateCount = 1;
  const cargoExtra = Math.max(0, items.length - cargoTemplateCount);
  const cargoFooterStart = 11;
  const cargoRowsPerItem = 2;

  if (!cargo.api.getRow(cargoFooterStart)) {
    throw new Error('貨櫃清單範本找不到第 11 列固定內容');
  }

  if (cargoExtra > 0) {
    const cargoShift = cargoExtra * cargoRowsPerItem;

    // 固定內容（倉儲業、船公司簽章、頁碼）整體往下移。
    shiftRowsAndMerges(cargo.xml, cargoFooterStart, cargoShift);

    const cargoFooterAfter = cargo.api.getRow(cargoFooterStart + cargoShift);
    if (!cargoFooterAfter) throw new Error('貨櫃清單固定內容移動失敗');

    const sourceRow1 = cargo.api.getRow(9);
    const sourceRow2 = cargo.api.getRow(10);
    if (!sourceRow1 || !sourceRow2) {
      throw new Error('貨櫃清單範本找不到第 9、10 列資料樣板');
    }

    const sheetDataEl = cargo.xml.documentElement.getElementsByTagNameNS(NS,'sheetData')[0];
    if (!sheetDataEl) throw new Error('貨櫃清單找不到 sheetData');

    const mergeCellsEl = cargo.xml.documentElement.getElementsByTagNameNS(NS,'mergeCells')[0];
    const originalMerges = mergeCellsEl
      ? Array.from(mergeCellsEl.getElementsByTagNameNS(NS,'mergeCell')).map(x => x.getAttribute('ref'))
      : [];

    // 第9~10列的所有合併，例如 A9:A10、B9:B10、...、J9:J10。
    const dataMerges = originalMerges.filter(ref => {
      const nums = (String(ref).match(/\d+/g) || []).map(Number);
      return nums.length && Math.min(...nums) >= 9 && Math.max(...nums) <= 10;
    });

    // 每增加一筆，複製一組 2 列。
    for (let i = 0; i < cargoExtra; i++) {
      const newRow1 = 11 + i * 2;
      const newRow2 = newRow1 + 1;
      const manifestRow = 16 + cargoTemplateCount + i;

      const clone1 = sourceRow1.cloneNode(true);
      const clone2 = sourceRow2.cloneNode(true);
      clone1.setAttribute('r', String(newRow1));
      clone2.setAttribute('r', String(newRow2));

      // 將兩列的儲存格座標改成新列號，公式則依 Template 第13/14列的公式
      // 往艙單下一筆延伸。
      for (const [clone, newRow] of [[clone1, newRow1], [clone2, newRow2]]) {
        for (const cell of Array.from(clone.getElementsByTagNameNS(NS,'c'))) {
          const oldRef = cell.getAttribute('r');
          if (!oldRef) continue;

          const ref = splitRef(oldRef);
          cell.setAttribute('r', `${ref.col}${newRow}`);

          const f = cell.getElementsByTagNameNS(NS,'f')[0];
          if (f) {
            f.textContent = f.textContent.replace(
              /進口艙單印1份!([A-Z]{1,3})16\b/g,
              (_, col) => `進口艙單印1份!${col}${manifestRow}`
            );

            // 清除舊公式快取，讓 Excel 開啟時重新計算。
            for (const v of Array.from(cell.getElementsByTagNameNS(NS,'v'))) {
              cell.removeChild(v);
            }
            const v = cargo.xml.createElementNS(NS,'v');
            v.textContent = '';
            cell.appendChild(v);
          }
        }
      }

      sheetDataEl.insertBefore(clone1, cargoFooterAfter);
      sheetDataEl.insertBefore(clone2, cargoFooterAfter);

      // 複製第13~14列原本的合併結構到新的兩列。
      if (mergeCellsEl) {
        for (const ref of dataMerges) {
          const shifted = ref.replace(
            /(\d+)/g,
            m => String(Number(m) + (newRow1 - 9))
          );
          const exists = Array.from(mergeCellsEl.getElementsByTagNameNS(NS,'mergeCell'))
            .some(mc => mc.getAttribute('ref') === shifted);

          if (!exists) {
            const mc = cargo.xml.createElementNS(NS,'mergeCell');
            mc.setAttribute('ref', shifted);
            mergeCellsEl.appendChild(mc);
          }
        }
      }
    }

    if (mergeCellsEl) {
      mergeCellsEl.setAttribute(
        'count',
        String(mergeCellsEl.getElementsByTagNameNS(NS,'mergeCell').length)
      );
    }
  }

  // 每一筆資料都依照最新 Template 原本的公式模式，
  // 只將艙單來源列號由16、17、18往後延伸。
  // 第一列是項次與主要資料；第二列是同一貨櫃的延伸資料。
  for (let i = 0; i < items.length; i++) {
    const r1 = cargoStart + i * 2;
    const r2 = r1 + 1;
    const mrow = 16 + i;

    cargo.api.setValue(`A${r1}`, i + 1);

    cargo.api.setFormula(`B${r1}`, `=進口艙單印1份!E${mrow}`, '');
    cargo.api.setFormula(`C${r1}`, `=進口艙單印1份!P${mrow}`, '');
    cargo.api.setFormula(`D${r1}`, `=進口艙單印1份!B${mrow}`, '');
    cargo.api.setFormula(`E${r1}`, `=進口艙單印1份!C${mrow}`, '');
    cargo.api.setFormula(`F${r1}`, `=進口艙單印1份!D${mrow}`, '');
    cargo.api.setFormula(`G${r1}`, `=B${r1}`, '');
    cargo.api.setFormula(`H${r1}`, `=進口艙單印1份!U${mrow}`, '');

    // 第二列 G 欄是範例原本的公式：抓艙單 I 欄重量。
    cargo.api.setFormula(`G${r2}`, `=進口艙單印1份!I${mrow}`, '');

    // J 欄依 Template 原本固定為 ESN500；I 欄進出站註記保留範例狀態。
    cargo.api.setValue(`J${r1}`, 'ESN500');
  }

  // Template 1筆時為 A1:J15；每增加1筆貨櫃會增加2列。
  const cargoPrintEnd = 15 + Math.max(0, items.length - 1) * cargoRowsPerItem;
  for (const dn of Array.from(workbookXml.getElementsByTagNameNS(NS,'definedName'))) {
    const name = dn.getAttribute('name');
    const text = String(dn.textContent || '');
    if (name === '_xlnm.Print_Area' && text.includes('貨櫃清單-1份')) {
      dn.textContent = `'貨櫃清單-1份'!$A$1:$J$${cargoPrintEnd}`;
    }
  }

  const cargoDimension = cargo.xml.documentElement.getElementsByTagNameNS(NS,'dimension')[0];
  if (cargoDimension && cargoDimension.getAttribute('ref')) {
    const old = cargoDimension.getAttribute('ref');
    cargoDimension.setAttribute(
      'ref',
      old.replace(/(\d+)$/, m => String(Number(m) + cargoExtra * cargoRowsPerItem))
    );
  }

  const appDimension = application.xml.documentElement.getElementsByTagNameNS(NS,'dimension')[0];
  if (appDimension && appDimension.getAttribute('ref')) {
    const old = appDimension.getAttribute('ref');
    appDimension.setAttribute('ref', old.replace(/(\d+)$/, m => String(Number(m) + appExtra)));
  }

  // 准單申請 Template 1 筆時列印範圍為 A1:I33；每增加 1 筆，最後一列 +1。
  const appPrintEnd = 33 + Math.max(0, items.length - 1);
  for (const dn of Array.from(workbookXml.getElementsByTagNameNS(NS,'definedName'))) {
    const name = dn.getAttribute('name');
    const text = String(dn.textContent || '');
    if (name === '_xlnm.Print_Area' && text.includes('准單申請-1份')) {
      dn.textContent = `'准單申請-1份 '!$A$1:$I$${appPrintEnd}`;
    }
  }


  // ═══════════════════════════════════════════════════════════════════
  // 第五階段：運送單
  // Template 現在只提供「運送第1筆」一張母版。
  // 第1筆直接使用 Template；第2筆起複製「運送第1筆」建立新工作表。
  // 每張工作表固定列印 A1:N41。
  // ═══════════════════════════════════════════════════════════════════
  const transportTemplateCount = 1;
  const transportExtra = Math.max(0, items.length - transportTemplateCount);
  const transportSource = getWorksheetSheetInfo('運送第1筆');
  const sheetsEl = workbookXml.getElementsByTagNameNS(NS, 'sheets')[0];
  if (!sheetsEl) throw new Error('workbook.xml 找不到 sheets');

  // 取得目前最大的 sheetId / relationship Id，新增工作表時遞增。
  let maxSheetId = 0;
  for (const s of Array.from(sheetsEl.getElementsByTagNameNS(NS, 'sheet'))) {
    maxSheetId = Math.max(maxSheetId, Number(s.getAttribute('sheetId')) || 0);
  }
  let maxRidNum = 0;
  for (const r of Array.from(relsXml.getElementsByTagName('Relationship'))) {
    const m = String(r.getAttribute('Id') || '').match(/^rId(\d+)$/);
    if (m) maxRidNum = Math.max(maxRidNum, Number(m[1]));
  }

  const ctFileTransport = zip.file('[Content_Types].xml');
  const ctXmlTransport = ctFileTransport
    ? parser.parseFromString(await ctFileTransport.async('text'), 'application/xml')
    : null;

  // 以第1張 Template 運送單為母版；它本身是第1筆，所以公式基準是艙單第16列、貨櫃清單第9列。
  const sourceTransportXml = parser.parseFromString(
    await zip.file(transportSource.target).async('text'),
    'application/xml'
  );

  for (let i = 0; i < transportExtra; i++) {
    const itemIndex = transportTemplateCount + i; // 0-based，第2筆開始
    const sheetNumber = itemIndex + 1;
    const newName = `運送第${sheetNumber}筆`;
    const newSheetId = ++maxSheetId;
    const newRid = `rId${++maxRidNum}`;
    const newTarget = `xl/worksheets/sheet${newSheetId}.xml`;
    const newLocalSheetId = Array.from(sheetsEl.getElementsByTagNameNS(NS, 'sheet')).length;

    // 防止重複名稱（若 Template 未來已經有同名工作表，就直接報明確錯誤）。
    if (Array.from(sheetsEl.getElementsByTagNameNS(NS, 'sheet'))
      .some(s => s.getAttribute('name') === newName)) {
      throw new Error(`運送單工作表名稱重複：${newName}`);
    }

    const newXml = sourceTransportXml.cloneNode(true);
    const root = newXml.documentElement;

    // 公式來源列：
    // 第2筆 → 艙單17、貨櫃清單11
    // 第3筆 → 艙單18、貨櫃清單13
    const manifestRow = 16 + itemIndex;
    const cargoRow = 9 + itemIndex * 2;

    for (const cell of Array.from(root.getElementsByTagNameNS(NS, 'c'))) {
      const f = cell.getElementsByTagNameNS(NS, 'f')[0];
      if (!f || f.textContent == null) continue;

      let formula = f.textContent;
      // 母版「運送第1筆」對應艙單第16列、貨櫃清單第9列。
      formula = formula.replace(/(進口艙單印1份![A-Z]{1,3})16\b/g, `$1${manifestRow}`);
      formula = formula.replace(/('貨櫃清單-1份'![A-Z]{1,3})9\b/g, `$1${cargoRow}`);

      f.textContent = formula;

      // 公式快取清空，讓 Excel 開啟時依新的來源重新計算。
      for (const v of Array.from(cell.getElementsByTagNameNS(NS, 'v'))) {
        cell.removeChild(v);
      }
      const v = newXml.createElementNS(NS, 'v');
      v.textContent = '';
      cell.appendChild(v);
    }

    // 維持 A1:P41 的 Template dimension；列印範圍則明確設定為 A1:N41。
    const dimension = root.getElementsByTagNameNS(NS, 'dimension')[0];
    if (dimension) dimension.setAttribute('ref', 'A1:P41');

    // 寫入新的 worksheet XML。
    zip.file(newTarget, serializer.serializeToString(newXml));

    // 複製 Template 第1張運送單的 worksheet relationship。
    const sourceRelPath = `xl/worksheets/_rels/${transportSource.target.split('/').pop()}.rels`;
    const newRelPath = `xl/worksheets/_rels/sheet${newSheetId}.xml.rels`;
    const sourceRelFile = zip.file(sourceRelPath);
    if (sourceRelFile) {
      zip.file(newRelPath, await sourceRelFile.async('text'));
    }

    // workbook.xml 新增 sheet。
    const sheetNode = workbookXml.createElementNS(NS, 'sheet');
    sheetNode.setAttribute('name', newName);
    sheetNode.setAttribute('sheetId', String(newSheetId));
    sheetNode.setAttributeNS(REL_NS, 'r:id', newRid);
    sheetsEl.appendChild(sheetNode);

    // workbook.xml.rels 新增 worksheet relationship。
    const relNode = relsXml.createElementNS(
      'http://schemas.openxmlformats.org/package/2006/relationships',
      'Relationship'
    );
    relNode.setAttribute('Id', newRid);
    relNode.setAttribute(
      'Type',
      'http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet'
    );
    relNode.setAttribute('Target', `worksheets/sheet${newSheetId}.xml`);
    relsXml.documentElement.appendChild(relNode);

    // 每一張運送單都有自己的 Print_Area：A1:N41。
    const definedNamesEl = workbookXml.getElementsByTagNameNS(NS, 'definedNames')[0]
      || workbookXml.appendChild(workbookXml.createElementNS(NS, 'definedNames'));

    const printName = workbookXml.createElementNS(NS, 'definedName');
    printName.setAttribute('name', '_xlnm.Print_Area');
    printName.setAttribute('localSheetId', String(newLocalSheetId));
    printName.textContent = `'${newName}'!$A$1:$N$41`;
    definedNamesEl.appendChild(printName);

    // [Content_Types].xml 新增這張 worksheet 的 Override。
    if (ctXmlTransport) {
      const override = ctXmlTransport.createElementNS(
        'http://schemas.openxmlformats.org/package/2006/content-types',
        'Override'
      );
      override.setAttribute('PartName', `/xl/worksheets/sheet${newSheetId}.xml`);
      override.setAttribute(
        'ContentType',
        'application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml'
      );
      ctXmlTransport.documentElement.appendChild(override);
    }
  }

  // 寫回所有動態工作表；運送單第4筆起已在上方建立。
  zip.file(t1.target, serializer.serializeToString(t1.xml));
  zip.file(red.target, serializer.serializeToString(red.xml));
  zip.file(application.target, serializer.serializeToString(application.xml));
  zip.file(cargo.target, serializer.serializeToString(cargo.xml));
  zip.file(shipTarget, serializer.serializeToString(shipXml));
  zip.file(sheetTarget, serializer.serializeToString(sheetXml));
  zip.file('xl/workbook.xml', serializer.serializeToString(workbookXml));
  zip.file('xl/_rels/workbook.xml.rels', serializer.serializeToString(relsXml));

  // ═══════════════════════════════════════════════════════════════════
  // 公式快取同步：避免 Excel「啟用編輯」前後顯示不同。
  // 受保護的檢視可能直接顯示 <v> 裡的舊快取值；按下「啟用編輯」後，
  // Excel 才會依公式重新計算，因此下載後會看到前後兩個畫面不同。
  // 這裡在匯出前，依目前 XML 內的公式與資料重新建立可用的 cached value，
  // 同時保留公式本身，讓「啟用編輯前」就能看到與重新計算後一致的內容。
  // 目前 Template 使用到的公式類型包含：直接引用、& 串接、IF、SUM。
  // ═══════════════════════════════════════════════════════════════════
  const sharedStrings = [];
  const sharedStringsFile = zip.file('xl/sharedStrings.xml');
  if (sharedStringsFile) {
    const ssXml = parser.parseFromString(await sharedStringsFile.async('text'), 'application/xml');
    for (const si of Array.from(ssXml.getElementsByTagNameNS(NS, 'si'))) {
      const parts = Array.from(si.getElementsByTagNameNS(NS, 't')).map(t => t.textContent || '');
      sharedStrings.push(parts.join(''));
    }
  }

  function splitFormulaArgs(text) {
    const args = [];
    let start = 0, depth = 0, inString = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (ch === '"') {
        if (inString && text[i + 1] === '"') { i++; continue; }
        inString = !inString;
      } else if (!inString) {
        if (ch === '(') depth++;
        else if (ch === ')') depth--;
        else if (ch === ',' && depth === 0) {
          args.push(text.slice(start, i).trim());
          start = i + 1;
        }
      }
    }
    args.push(text.slice(start).trim());
    return args;
  }

  function splitTopLevel(text, operator) {
    const parts = [];
    let start = 0, depth = 0, inString = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (ch === '"') {
        if (inString && text[i + 1] === '"') { i++; continue; }
        inString = !inString;
      } else if (!inString) {
        if (ch === '(') depth++;
        else if (ch === ')') depth--;
        else if (ch === operator && depth === 0) {
          parts.push(text.slice(start, i));
          start = i + 1;
        }
      }
    }
    parts.push(text.slice(start));
    return parts;
  }

  function unquoteExcelString(text) {
    const s = String(text || '').trim();
    if (s.length >= 2 && s[0] === '"' && s[s.length - 1] === '"') {
      return s.slice(1, -1).replace(/""/g, '"');
    }
    return null;
  }

  function parseCellRefToken(token) {
    const s = String(token || '').trim();
    const m = s.match(/^(?:'((?:[^']|'')+)'|(.+?))!([A-Z]{1,3}\d+)$/i);
    if (m) return { sheet: (m[1] || m[2]).replace(/''/g, "'"), ref: m[3].toUpperCase() };
    const c = s.match(/^([A-Z]{1,3}\d+)$/i);
    if (c) return { sheet: null, ref: c[1].toUpperCase() };
    return null;
  }

  function getCellElement(sheetXml, ref) {
    const m = String(ref).match(/^([A-Z]+)(\d+)$/i);
    if (!m) return null;
    const row = Array.from(sheetXml.getElementsByTagNameNS(NS, 'row'))
      .find(r => r.getAttribute('r') === m[2]);
    if (!row) return null;
    return Array.from(row.getElementsByTagNameNS(NS, 'c'))
      .find(c => c.getAttribute('r') === ref);
  }

  const formulaCacheSheets = new Map();
  const formulaCacheValues = new Map();

  async function loadAllWorksheetXml() {
    const result = new Map();
    for (const sheetEl of Array.from(workbookXml.getElementsByTagNameNS(NS, 'sheet'))) {
      const name = sheetEl.getAttribute('name') || '';
      const rid = sheetEl.getAttributeNS(REL_NS, 'id');
      const rel = Array.from(relsXml.getElementsByTagName('Relationship'))
        .find(x => x.getAttribute('Id') === rid);
      if (!rel) continue;
      let target = rel.getAttribute('Target').replace(/^\//, '');
      if (!target.startsWith('xl/')) target = 'xl/' + target.replace(/^\.\//, '');
      const file = zip.file(target);
      if (!file) continue;
      const xml = parser.parseFromString(await file.async('text'), 'application/xml');
      result.set(name, { target, xml });
    }
    return result;
  }

  const allSheets = await loadAllWorksheetXml();
  for (const [name, info] of allSheets) formulaCacheSheets.set(name, info.xml);

  function readCellValue(sheetName, ref, stack) {
    const key = `${sheetName}!${ref}`;
    if (formulaCacheValues.has(key)) return formulaCacheValues.get(key);
    if (stack.has(key)) return '';
    const sheetXml = formulaCacheSheets.get(sheetName);
    if (!sheetXml) return '';
    const cell = getCellElement(sheetXml, ref);
    if (!cell) return '';

    const f = cell.getElementsByTagNameNS(NS, 'f')[0];
    if (f && f.textContent != null) {
      const nextStack = new Set(stack);
      nextStack.add(key);
      const value = evalFormula(f.textContent, sheetName, nextStack);
      formulaCacheValues.set(key, value);
      return value;
    }

    const inline = cell.getElementsByTagNameNS(NS, 'is')[0];
    if (inline) {
      const value = Array.from(inline.getElementsByTagNameNS(NS, 't')).map(t => t.textContent || '').join('');
      formulaCacheValues.set(key, value);
      return value;
    }

    const v = cell.getElementsByTagNameNS(NS, 'v')[0];
    if (!v) return '';
    const raw = v.textContent || '';
    if (cell.getAttribute('t') === 's') {
      const value = sharedStrings[Number(raw)] ?? '';
      formulaCacheValues.set(key, value);
      return value;
    }
    if (cell.getAttribute('t') === 'str') {
      formulaCacheValues.set(key, raw);
      return raw;
    }
    const num = Number(raw);
    const value = Number.isFinite(num) ? num : raw;
    formulaCacheValues.set(key, value);
    return value;
  }

  function evalFormula(formulaText, currentSheet, stack) {
    let expr = String(formulaText || '').trim();
    if (expr.startsWith('=')) expr = expr.slice(1);

    const quoted = unquoteExcelString(expr);
    if (quoted !== null) return quoted;

    const concatParts = splitTopLevel(expr, '&');
    if (concatParts.length > 1) {
      return concatParts.map(part => String(evalFormula(part, currentSheet, stack) ?? '')).join('');
    }

    const fn = expr.match(/^([A-Z]+)\((.*)\)$/i);
    if (fn) {
      const name = fn[1].toUpperCase();
      const args = splitFormulaArgs(fn[2]);
      if (name === 'IF') {
        const condition = String(args[0] || '').trim();
        const eqParts = splitTopLevel(condition, '=');
        let ok = false;
        if (eqParts.length === 2) {
          const left = evalFormula(eqParts[0], currentSheet, stack);
          const right = evalFormula(eqParts[1], currentSheet, stack);
          ok = String(left) === String(right);
        } else {
          const value = evalFormula(condition, currentSheet, stack);
          ok = !!value;
        }
        return ok ? evalFormula(args[1] || '""', currentSheet, stack)
                  : evalFormula(args[2] || '""', currentSheet, stack);
      }
      if (name === 'SUM') {
        let total = 0;
        for (const arg of args) {
          const range = String(arg || '').trim().match(/^(?:(?:'((?:[^']|'')+)'|(.+?))!)?([A-Z]{1,3}\d+):([A-Z]{1,3}\d+)$/i);
          if (!range) {
            const value = Number(evalFormula(arg, currentSheet, stack));
            if (Number.isFinite(value)) total += value;
            continue;
          }
          const sheetName = (range[1] || range[2] || currentSheet).replace(/''/g, "'");
          const a = range[3].toUpperCase(), b = range[4].toUpperCase();
          const am = a.match(/^([A-Z]+)(\d+)$/), bm = b.match(/^([A-Z]+)(\d+)$/);
          if (!am || !bm) continue;
          const c1 = colNum(am[1]), c2 = colNum(bm[1]);
          const r1 = Number(am[2]), r2 = Number(bm[2]);
          for (let r = Math.min(r1, r2); r <= Math.max(r1, r2); r++) {
            for (let c = Math.min(c1, c2); c <= Math.max(c1, c2); c++) {
              let n = c, letters = '';
              while (n > 0) { const rem = (n - 1) % 26; letters = String.fromCharCode(65 + rem) + letters; n = Math.floor((n - 1) / 26); }
              const value = Number(readCellValue(sheetName, `${letters}${r}`, stack));
              if (Number.isFinite(value)) total += value;
            }
          }
        }
        return total;
      }
    }

    // Excel 合併儲存格常用「工作表!G16:I16」這種範圍公式，
    // 實際顯示值來自範圍左上角的 G16。
    // 若把整個範圍當成一般文字，cached value 就會變成公式本身，
    // 導致 Excel 在「啟用編輯」前直接顯示 =准單(紅紙)...。
    const rangeRef = expr.match(/^(?:'((?:[^']|'')+)'|(.+?))!([A-Z]{1,3}\d+):[A-Z]{1,3}\d+$/i);
    if (rangeRef) {
      const sheetName = (rangeRef[1] || rangeRef[2]).replace(/''/g, "'");
      return readCellValue(sheetName, rangeRef[3].toUpperCase(), stack);
    }

    const ref = parseCellRefToken(expr);
    if (ref) return readCellValue(ref.sheet || currentSheet, ref.ref, stack);

    const num = Number(expr);
    return Number.isFinite(num) ? num : expr;
  }

  for (const [sheetName, info] of allSheets) {
    const sheetXml = info.xml;
    for (const cell of Array.from(sheetXml.getElementsByTagNameNS(NS, 'c'))) {
      const f = cell.getElementsByTagNameNS(NS, 'f')[0];
      if (!f || f.textContent == null) continue;
      const ref = cell.getAttribute('r');
      const value = readCellValue(sheetName, ref, new Set());

      for (const v of Array.from(cell.getElementsByTagNameNS(NS, 'v'))) cell.removeChild(v);
      cell.removeAttribute('t');
      const v = sheetXml.createElementNS(NS, 'v');
      if (typeof value === 'number' && Number.isFinite(value)) {
        v.textContent = String(value);
      } else {
        cell.setAttribute('t', 'str');
        v.textContent = String(value ?? '');
      }
      cell.appendChild(v);
    }
    zip.file(info.target, serializer.serializeToString(sheetXml));
  }

  const ctFile = zip.file('[Content_Types].xml');
  if (ctFile) {
    const ctXml = parser.parseFromString(await ctFile.async('text'),'application/xml');
    for (const ov of Array.from(ctXml.getElementsByTagName('Override'))) {
      if (ov.getAttribute('PartName') === '/xl/calcChain.xml') ov.parentNode.removeChild(ov);
    }
    zip.file('[Content_Types].xml', serializer.serializeToString(ctXml));
  }
  if (ctXmlTransport) {
    // 避免重複的 calcChain Override；新增的 worksheet Override 已在上方加入。
    for (const ov of Array.from(ctXmlTransport.getElementsByTagName('Override'))) {
      if (ov.getAttribute('PartName') === '/xl/calcChain.xml') ov.parentNode.removeChild(ov);
    }
    zip.file('[Content_Types].xml', serializer.serializeToString(ctXmlTransport));
  }

  return await zip.generateAsync({type:'arraybuffer',compression:'DEFLATE'});
}

function backToEdit() {
  // 回到輸入區，但保留已選船舶、日期、卸存地與已匯入的原始 Excel，方便直接修改後重新產生。
  document.getElementById('preview-section').classList.remove('show');
  document.querySelectorAll('.step-section').forEach(el => el.style.display = '');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function exportManifest() {
  const btnEl = document.querySelector('.btn-export');
  const originalText = btnEl.textContent;
  btnEl.textContent = '匯出中…請稍候';
  btnEl.disabled = true;
  try {
    const meta = window._manifestMeta;
    const loc = currentLocationTab;
    const outBuf = await buildManifestXlsx(loc);
    const filename = `${meta.ship.ship_name}_${meta.registration}_${loc}_艙單.xlsx`;
    const blob = new Blob([outBuf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  } catch(err) {
    alert('匯出失敗：' + err.message);
    console.error(err);
  } finally {
    btnEl.textContent = originalText;
    btnEl.disabled = false;
  }
}


init();
