<!DOCTYPE html>
<html lang="zh-TW" style="background:#ffffff;color-scheme:light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>系統 — 登入</title>
<style>
:root {
  --cyan:  #1a7bbf;
  --amber: #c07000;
  --red:   #cc2222;
  --txt:   #111111;
  --txt2:  #444444;
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent }
html, body { overflow-x:hidden; font-size:16px }
body {
  background:#ffffff !important; color:#111111 !important;
  font-family:-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
  min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  padding:20px;
}

.login-card {
  width:100%; max-width:360px;
  background:#ffffff;
  border:1px solid rgba(0,0,0,.10);
  border-radius:16px;
  padding:36px 28px 28px;
  box-shadow:0 8px 32px rgba(0,0,0,.08);
}

.logo {
  text-align:center; margin-bottom:10px;
}
.title {
  text-align:center;
  font-size:1.15rem; font-weight:900; letter-spacing:3px;
  color:var(--cyan);
  margin-bottom:2px;
}
.subtitle {
  text-align:center;
  font-size:.78rem; color:var(--txt2);
  margin-bottom:28px;
}

.field { margin-bottom:16px }
.field label {
  display:block; font-size:.72rem; font-weight:700;
  color:var(--txt2); letter-spacing:1px; margin-bottom:6px;
}
.field input {
  width:100%; padding:12px 14px;
  border:1.5px solid rgba(0,0,0,.15); border-radius:8px;
  font-size:.95rem; font-family:inherit; color:var(--txt);
  outline:none; transition:border-color .2s;
  background:#ffffff;
}
.field input:focus { border-color:var(--cyan) }

.login-btn {
  width:100%; padding:13px;
  background:var(--cyan); color:#ffffff;
  border:none; border-radius:8px;
  font-size:.95rem; font-weight:800; letter-spacing:1px;
  cursor:pointer; font-family:inherit;
  margin-top:8px;
  transition:opacity .15s;
}
.login-btn:active { opacity:.85 }

.error-msg {
  color:var(--red); font-size:.78rem; font-weight:600;
  text-align:center; margin-top:12px; min-height:18px;
}

.footer-note {
  text-align:center; font-size:.68rem; color:#999999;
  margin-top:24px; line-height:1.6;
}
</style>
</head>

<script>
/* ══════════════════════════════
   SUPABASE CONFIG
══════════════════════════════ */
const SB_URL = 'https://ruziacdggdfyvlbcjnan.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ1emlhY2RnZ2RmeXZsYmNqbmFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4NzE1OTEsImV4cCI6MjEwMDQ0NzU5MX0.3P7SzY2EfKtUTcuaBB0fMY0FOIdp_X3KmkfRnL8wuSg';

// 簡易密碼雜湊（SHA-256），避免明碼比對
async function hashPassword(pw) {
  const enc = new TextEncoder().encode(pw);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

// enter 鍵送出
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
  document.getElementById('username').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
});

async function doLogin() {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  const errEl = document.getElementById('error-msg');
  const btnEl = document.querySelector('.login-btn');

  if (!u || !p) {
    errEl.textContent = '請輸入帳號和密碼';
    return;
  }

  errEl.textContent = '';
  btnEl.textContent = '登入中…';
  btnEl.disabled = true;

  try {
    const pwHash = await hashPassword(p);

    const res = await fetch(
      `${SB_URL}/rest/v1/users?username=eq.${encodeURIComponent(u)}&select=username,password_hash,display_name`,
      {
        headers: {
          'apikey': SB_KEY,
          'Authorization': 'Bearer ' + SB_KEY,
        }
      }
    );

    if (!res.ok) throw new Error('連線失敗');

    const data = await res.json();

    if (!data || data.length === 0 || data[0].password_hash !== pwHash) {
      errEl.textContent = '帳號或密碼錯誤';
      btnEl.textContent = '登入';
      btnEl.disabled = false;
      return;
    }

    const authData = {
      username: u,
      displayName: data[0].display_name || u,
      loginAt: new Date().toISOString()
    };

    // 一律使用 sessionStorage：關閉瀏覽器分頁後就需要重新登入，不做「記住我」的長期保存
    sessionStorage.setItem('ctr-auth', JSON.stringify(authData));

    redirectToApp();

  } catch (e) {
    errEl.textContent = '連線失敗，請檢查網路';
    btnEl.textContent = '登入';
    btnEl.disabled = false;
  }
}

function redirectToApp() {
  window.location.replace('console.html');
}
</script>
