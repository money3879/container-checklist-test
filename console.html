<!DOCTYPE html>
<html lang="zh-TW" style="background:#ffffff;color-scheme:light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>首頁</title>
<style>
:root {
  --cyan:  #1a7bbf;
  --amber: #c07000;
  --red:   #cc2222;
  --txt:   #111111;
  --txt2:  #444444;
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent }
html, body { overflow-x:hidden; font-size:16px }
body {
  background:#ffffff !important; color:#111111 !important;
  font-family:-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
  min-height:100vh;
}

/* ── TOP BAR ── */
#top {
  background:#f2f4f6; border-bottom:2px solid var(--cyan);
  padding:14px 16px;
  display:flex; align-items:center; justify-content:space-between;
}
.top-left { display:flex; flex-direction:column; gap:2px }
.app-title { font-size:1rem; font-weight:900; letter-spacing:3px; color:#1a5a8a }
.user-info { font-size:.72rem; color:var(--txt2) }
.logout-btn {
  border:1px solid rgba(204,34,34,.3); border-radius:6px;
  padding:8px 13px; font-size:.8rem; font-weight:700;
  cursor:pointer; font-family:inherit; background:#ffffff; color:#cc2222;
}
.pwd-btn {
  border:1px solid rgba(26,123,191,.3); border-radius:6px;
  padding:8px 13px; font-size:.8rem; font-weight:700;
  cursor:pointer; font-family:inherit; background:#ffffff; color:#1a7bbf;
}

/* ── MAIN ── */
main { padding:20px 16px }
.section-title {
  font-size:.8rem; font-weight:700; color:var(--txt2);
  letter-spacing:1.5px; margin-bottom:12px;
}

.app-grid {
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}
@media (min-width:480px) {
  .app-grid { grid-template-columns:1fr 1fr; }
}

.app-card {
  background:#ffffff; border:1px solid rgba(0,0,0,.12); border-radius:14px;
  padding:20px 18px; cursor:pointer;
  transition:box-shadow .15s, transform .1s;
  display:flex; flex-direction:column; gap:8px;
}
.app-card:active { box-shadow:0 4px 16px rgba(0,0,0,.10); transform:scale(0.98) }

.app-icon { display:flex; align-items:center; margin-bottom:2px }
.app-name { font-size:1rem; font-weight:800; color:var(--txt) }
.app-desc { font-size:.78rem; color:var(--txt2); line-height:1.5 }

.app-card.disabled {
  opacity:.45; cursor:default;
}
.app-card.disabled:active { transform:none; box-shadow:none }
.coming-soon {
  display:inline-block; font-size:.65rem; font-weight:700;
  background:#f0f0f0; color:#888888;
  padding:2px 8px; border-radius:10px; align-self:flex-start;
}

.empty-note {
  text-align:center; color:#999999; font-size:.8rem;
  padding:40px 20px; line-height:1.8;
}

/* ── PASSWORD DIALOG ── */
.dlg-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.5);
  z-index:400; display:none; align-items:center; justify-content:center; padding:20px;
}
.dlg-overlay.show { display:flex }
.dlg-box {
  background:#ffffff; border:1px solid rgba(0,0,0,.15); border-radius:12px;
  padding:22px 20px 18px; max-width:320px; width:100%;
  box-shadow:0 8px 32px rgba(0,0,0,.18);
}
.dlg-box h3 { font-size:.95rem; font-weight:800; color:#111111; margin-bottom:4px }
.dlg-btns { display:flex; gap:8px; margin-top:14px }
.dlg-cancel {
  flex:1; padding:10px; background:none; border:1px solid rgba(0,0,0,.2);
  color:#555555; border-radius:8px; font-size:.85rem; cursor:pointer; font-family:inherit;
}
.dlg-ok {
  flex:1; padding:10px; background:#1a7bbf; color:#fff; border:none;
  border-radius:8px; font-size:.85rem; font-weight:800; cursor:pointer; font-family:inherit;
}
</style>
</head>
<body>

<div id="top">
  <div class="top-left">
    <span class="app-title">⚓ 首頁</span>
    <span class="user-info" id="user-info">—</span>
  </div>
  <div class="top-right" style="display:flex;gap:8px">
    <button class="pwd-btn" onclick="openChangePwd()">🔑 修改密碼</button>
    <button class="logout-btn" onclick="logout()">🚪 登出</button>
  </div>
</div>

</div>

<script>
const SB_URL = 'https://ruziacdggdfyvlbcjnan.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ1emlhY2RnZ2RmeXZsYmNqbmFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4NzE1OTEsImV4cCI6MjEwMDQ0NzU5MX0.3P7SzY2EfKtUTcuaBB0fMY0FOIdp_X3KmkfRnL8wuSg';

// 登入保護：未登入就導回登入頁
(function checkAuth() {
  const saved = localStorage.getItem('ctr-auth') || sessionStorage.getItem('ctr-auth');
  if (!saved) {
    window.location.replace('index.html');
    return;
  }
  try {

    if (!auth || !auth.username) throw new Error('invalid');
    window._currentUser = auth.username;
    document.getElementById('user-info').textContent = `使用者：${auth.displayName || auth.username}`;
  } catch(e) {

/* ══════════════════════════════
   CHANGE PASSWORD
══════════════════════════════ */
async function hashPassword(pw) {
  const enc = new TextEncoder().encode(pw);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function openChangePwd() {
  document.getElementById('pwd-old').value = '';
  document.getElementById('pwd-new').value = '';
  document.getElementById('pwd-confirm').value = '';
  document.getElementById('pwd-error').textContent = '';
  document.getElementById('dlg-pwd').classList.add('show');
}

function closePwdDlg() {
  document.getElementById('dlg-pwd').classList.remove('show');
}

async function submitPwdChange() {
  const oldPw = document.getElementById('pwd-old').value;
  const newPw = document.getElementById('pwd-new').value;
  const confirmPw = document.getElementById('pwd-confirm').value;
  const errEl = document.getElementById('pwd-error');
  const btnEl = document.getElementById('pwd-submit-btn');

  if (!oldPw || !newPw || !confirmPw) {
    errEl.textContent = '請填寫所有欄位';
    return;
  }
  if (newPw.length < 4) {
    errEl.textContent = '新密碼至少需要 4 個字元';
    return;
  }
  if (newPw !== confirmPw) {
    errEl.textContent = '兩次輸入的新密碼不一致';
    return;
  }

  errEl.textContent = '';
  btnEl.textContent = '處理中…';
  btnEl.disabled = true;

  try {
    const username = window._currentUser;
    const oldHash = await hashPassword(oldPw);

    const checkRes = await fetch(
      `${SB_URL}/rest/v1/users?username=eq.${encodeURIComponent(username)}&select=password_hash`,
      { headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY } }
    );
    const checkData = await checkRes.json();

    if (!checkData || checkData.length === 0 || checkData[0].password_hash !== oldHash) {
      errEl.textContent = '目前密碼輸入錯誤';
      btnEl.textContent = '確認修改';
      btnEl.disabled = false;
      return;
    }

    const newHash = await hashPassword(newPw);
    const updateRes = await fetch(
      `${SB_URL}/rest/v1/users?username=eq.${encodeURIComponent(username)}`,
      {
        method: 'PATCH',
        headers: {
          'apikey': SB_KEY,
          'Authorization': 'Bearer ' + SB_KEY,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify({ password_hash: newHash })
      }
    );

    if (!updateRes.ok) {
      const errBody = await updateRes.text();
      throw new Error('更新失敗：' + errBody);
    }

    const verifyRes = await fetch(
      `${SB_URL}/rest/v1/users?username=eq.${encodeURIComponent(username)}&select=password_hash`,
      { headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY } }
    );
    const verifyData = await verifyRes.json();
    if (!verifyData || verifyData.length === 0 || verifyData[0].password_hash !== newHash) {
      errEl.textContent = '更新未生效，可能是權限設定問題（RLS）';
      btnEl.textContent = '確認修改';
      btnEl.disabled = false;
      return;
    }

    closePwdDlg();
    alert('✅ 密碼已修改成功');

  } catch (e) {
    errEl.textContent = '連線失敗：' + (e.message || '請稍後再試');
    btnEl.textContent = '確認修改';
    btnEl.disabled = false;
  }
}
</script>
